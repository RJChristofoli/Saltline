name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - "type:bug"
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable reproduction and relevant commands.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Saltline version, operating system, Python version, and repository characteristics.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, stack traces, screenshots, or sample output with sensitive data removed.
